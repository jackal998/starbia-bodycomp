name: 新增量測
description: 上傳 STARBIA 701 的 QR code 照片 → 自動解析、確認時間 → 產生當日報表與歷史報表
title: "量測"
body:
  - type: markdown
    attributes:
      value: |
        把機器「掃描報告結果」畫面的 **QR code 照片** 放進下面的欄位，按 **Create** 送出就好。
        1–2 分鐘後機器人會自動檢查：都正常就直接寫入、產生報表、關閉 issue，你什麼都不用做。
        有異常才會留言「⚠ 需要你確認」，看過後留言 `/confirm`（時間不對：`/confirm 2026-01-15 18:30`）。
  - type: textarea
    id: qr
    attributes:
      label: QR code 照片
      description: 拖曳或貼上照片，可以多張（例如拍糊了多拍一張）；一個 issue 只放同一次量測。
    validations:
      required: true
  - type: input
    id: time
    attributes:
      label: 實際量測時間
      description: 台灣時間。留空 = 照片的拍攝時間（如果 GitHub 有保留），否則用這個 issue 的建立時間。機器上的時間常常不準，不要抄它。
      placeholder: "2026-01-15 18:30"
    validations:
      required: false
  - type: textarea
    id: screens
    attributes:
      label: 機器螢幕報告照片（選填）
      description: 報告總覽、各肢段、體組成分析等頁面。會一起存進 body-comp/raw/，日後可用來核對數值。
    validations:
      required: false
  - type: textarea
    id: note
    attributes:
      label: 備註（選填）
    validations:
      required: false
