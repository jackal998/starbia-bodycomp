# 「新增量測」issue → 解析 QR → 留言確認時間 → /confirm 後寫入資料、產生報表、commit 到 main。
# 流程細節見 scripts/gh_intake.py。
name: 新增量測

on:
  issues:
    types: [opened, edited, reopened]
  issue_comment:
    types: [created, edited]          # 編輯留言（例如把打錯的指令改正）也會執行

permissions:
  contents: write
  issues: write

# 每個 issue 一組：同一組只保留一個「等待中」的執行，用全域一組的話，連續對幾個 issue /confirm
# 時中間的會被取消。不同 issue 同時寫入的衝突由 gh_intake.py 處理（push 被拒就從最新 main 重做）。
concurrency:
  group: intake-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  intake:
    if: >-
      !github.event.issue.pull_request &&
      contains(github.event.issue.body, '### QR code 照片') &&
      (github.event_name == 'issues' || contains(github.event.comment.body, '/') || contains(github.event.comment.body, '／'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}   # 分支最新版，不是事件當下的 commit（re-run 也一樣）
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/gh_intake.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: 失敗時通知
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body "⚠ 處理失敗，資料沒有寫入。log：$RUN_URL"
